    <meta charset="UTF-8" />

    <title>Building Innovation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
      /* Custom scrollbar for gallery */
      .hide-scroll::-webkit-scrollbar {
        display: none;
      }
      .hide-scroll {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* Print Styles for PDF Generation */
      @media print {
        @page { margin: 0.5cm; size: A4 portrait; }
        body { 
          background-color: white !important; 
          color: black !important; 
          -webkit-print-color-adjust: exact !important; 
          print-color-adjust: exact !important;
        }
        
        /* Hide everything by default */
        body * {
          visibility: hidden;
        }
        
        /* Only show the print area */
        #print-area, #print-area * {
          visibility: visible;
        }
        
        #print-area {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          padding: 20px;
          background-color: white !important;
          color: black !important;
          border: none !important;
          box-shadow: none !important;
        }

        /* Hide buttons and interactive elements in print view */
        .no-print {
          display: none !important;
        }
        
        /* Force text colors for print */
        .print\:text-black { color: #000 !important; }
        .print\:text-slate-600 { color: #475569 !important; }
        .print\:border-black { border-color: #000 !important; }
        .print\:bg-white { background-color: #fff !important; }
      }
    </style>
