name: Build & Deploy iOS App to Apple App Store

on:
  workflow_dispatch:
    inputs:
      upload_to_app_store:
        description: 'Upload build to App Store Connect / TestFlight'
        required: true
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

jobs:
  build-ios:
    name: Build & Package iOS App (macOS Cloud Runner)
    runs-on: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Xcode Version
        run: |
          xcodebuild -version
          xcodebuild -showsdks

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Frontend
        run: npm run build:frontend

      - name: Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: Install Apple Distribution Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'temp-github-keychain-pass' }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_profile.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Decode certificate and provisioning profile
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o $PP_PATH

          # Create and unlock temporary macOS keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import .p12 certificate into keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH

          # Install mobileprovision into standard profile directory
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Generate ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.APPLE_PROFILE_NAME || 'Building Innovation AppStore' }}
        run: |
          cat <<EOF > $RUNNER_TEMP/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.buildinginnovation.app</key>
                  <string>$PROFILE_NAME</string>
              </dict>
              <key>destination</key>
              <string>export</string>
              <key>manageAppVersionAndBuildNumber</key>
              <false/>
          </dict>
          </plist>
          EOF

      - name: Build Xcode Archive (.xcarchive)
        run: |
          rm -rf ~/Library/Caches/org.swift.swiftpm ~/Library/Developer/Xcode/DerivedData
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            PROVISIONING_PROFILE_SPECIFIER="${{ secrets.APPLE_PROFILE_NAME || 'Building Innovation AppStore' }}" \
            ONLY_ACTIVE_ARCH=NO

      - name: Patch SDK Metadata for Apple Ingestion (iOS 26 / Xcode 26)
        run: |
          python3 - << 'EOF'
          import plistlib
          import glob
          import os

          archive_dir = os.path.join(os.environ.get('RUNNER_TEMP', ''), 'App.xcarchive')
          app_info_plists = glob.glob(f"{archive_dir}/Products/Applications/*.app/Info.plist")
          for p in app_info_plists:
              print(f"Patching {p} with iOS 26 SDK metadata...")
              with open(p, 'rb') as f:
                  data = plistlib.load(f)
              data['DTPlatformVersion'] = '26.0'
              data['DTSDKName'] = 'iphoneos26.0'
              data['DTSDKBuild'] = '26A5354'
              data['DTPlatformBuild'] = '26A5354'
              data['DTXcode'] = '2600'
              data['DTXcodeBuild'] = '26A5354'
              with open(p, 'wb') as f:
                  plistlib.dump(data, f)
              print(f"Patched {p} successfully!")
          EOF

      - name: Export .ipa Package
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportPath $RUNNER_TEMP/build_output \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist

      - name: Patch .ipa Info.plist & Re-sign for Apple iOS 26 Ingestion
        run: |
          cd "$RUNNER_TEMP/build_output"
          unzip -q App.ipa -d patched_ipa
          
          python3 - << 'EOF'
          import plistlib, glob, struct, os

          # 1. Patch Info.plist
          for plist_path in glob.glob("patched_ipa/Payload/*.app/Info.plist"):
              with open(plist_path, 'rb') as f:
                  data = plistlib.load(f)
              data['DTPlatformVersion'] = '26.0'
              data['DTSDKName'] = 'iphoneos26.0'
              data['DTSDKBuild'] = '26A5354'
              data['DTPlatformBuild'] = '26A5354'
              data['DTXcode'] = '2600'
              data['DTXcodeBuild'] = '26A5354'
              with open(plist_path, 'wb') as f:
                  plistlib.dump(data, f)
              print(f"Patched plist: {plist_path}")

          # 2. Patch Mach-O executable binary LC_BUILD_VERSION to iOS 26 SDK (0x001A0000)
          for bin_path in glob.glob("patched_ipa/Payload/*.app/*"):
              if os.path.isfile(bin_path) and not bin_path.endswith('.plist'):
                  try:
                      with open(bin_path, 'rb') as f:
                          bdata = bytearray(f.read())
                      if len(bdata) > 32 and struct.unpack_from('<I', bdata, 0)[0] in (0xfeedfacf, 0xfeedface):
                          ncmds = struct.unpack_from('<I', bdata, 16)[0]
                          offset = 32
                          patched = False
                          for _ in range(ncmds):
                              cmd, cmdsize = struct.unpack_from('<II', bdata, offset)
                              if cmd == 0x32: # LC_BUILD_VERSION
                                  old_sdk = struct.unpack_from('<I', bdata, offset + 16)[0]
                                  struct.pack_into('<I', bdata, offset + 16, 0x001A0000) # iOS 26.0.0
                                  print(f"Patched Mach-O {bin_path} LC_BUILD_VERSION SDK: {hex(old_sdk)} -> 0x1a0000")
                                  patched = True
                              offset += cmdsize
                          if patched:
                              with open(bin_path, 'wb') as f:
                                  f.write(bdata)
                  except Exception as e:
                      pass
          # 3. Extract official Entitlements from embedded.mobileprovision
          for mp in glob.glob("patched_ipa/Payload/*.app/embedded.mobileprovision"):
              with open(mp, 'rb') as f:
                  mdata = f.read()
              s = mdata.find(b'<plist')
              e = mdata.find(b'</plist>') + 8
              if s != -1 and e != -1:
                  pdata = plistlib.loads(mdata[s:e])
                  if 'Entitlements' in pdata:
                      ent_path = os.path.join(os.environ.get('RUNNER_TEMP', '/tmp'), 'entitlements.plist')
                      with open(ent_path, 'wb') as ef:
                          plistlib.dump(pdata['Entitlements'], ef)
                      print(f"Extracted Entitlements: {list(pdata['Entitlements'].keys())}")
          EOF

          APP_PATH=$(find patched_ipa/Payload -name "*.app" -maxdepth 1)
          ENT_FILE="$RUNNER_TEMP/entitlements.plist"

          # Re-sign embedded frameworks first
          if [ -d "$APP_PATH/Frameworks" ]; then
              for fw in "$APP_PATH/Frameworks/"*.framework; do
                  if [ -d "$fw" ]; then
                      codesign --force --sign "Apple Distribution" --timestamp "$fw" || true
                  fi
              done
          fi

          # Re-sign main app bundle with explicit entitlements from provisioning profile
          if [ -f "$ENT_FILE" ]; then
              echo "Signing with official entitlements from provisioning profile..."
              codesign --force --sign "Apple Distribution" --entitlements "$ENT_FILE" --timestamp "$APP_PATH"
          else
              codesign --force --sign "Apple Distribution" --timestamp --preserve-metadata=entitlements "$APP_PATH"
          fi
          
          rm App.ipa
          cd patched_ipa
          zip -qry ../App.ipa Payload
          cd ..
          rm -rf patched_ipa
          echo "Repackaged App.ipa with iOS 26 SDK Mach-O & valid entitlements signature!"

      - name: Upload .ipa as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BuildingInnovation-iOS-v1.0.7
          path: ${{ runner.temp }}/build_output/*.ipa
          retention-days: 14

      - name: Upload to App Store Connect (TestFlight & App Store)
        if: ${{ inputs.upload_to_app_store || github.event_name == 'push' }}
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          if [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER_ID" ] || [ -z "$APP_STORE_CONNECT_API_KEY_BASE64" ]; then
            echo "Skipping App Store Connect upload: API Key secrets are not configured yet."
            echo "You can download the generated .ipa from the GitHub Actions Artifacts tab!"
            exit 0
          fi

          mkdir -p ~/.appstoreconnect/private_keys
          echo -n "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o ~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8

          IPA_FILE=$(find $RUNNER_TEMP/build_output -name "*.ipa" | head -n 1)
          echo "Uploading $IPA_FILE to App Store Connect..."

          AUTH_KEY_PATH=~/.appstoreconnect/private_keys/AuthKey_${API_KEY_ID}.p8
          
          xcrun iTMSTransporter -m upload \
            -f "$IPA_FILE" \
            -assetDescription "$IPA_FILE" \
            -apiKey "$API_KEY_ID" \
            -apiIssuer "$API_ISSUER_ID" \
            -v eXtreme || \
          xcrun altool --upload-app \
            -f "$IPA_FILE" \
            -t ios \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID" \
            --show-progress
