name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Project
        run: npm run build

      - name: Create API Config
        run: |
          mkdir -p data
          # Check for API key in various secret names (backward compatible)
          API_KEY="${{ secrets.GEMINI_API_KEY || secrets.VITE_GEMINI_API_KEY || '' }}"
          if [ -n "$API_KEY" ]; then
            echo '{"GEMINI_API_KEY":"'"$API_KEY"'"}' > data/config.json
            echo "✅ API config created from GitHub secret"
          else
            echo "⚠️ No GEMINI_API_KEY or VITE_GEMINI_API_KEY secret found. AI generation will fail until configured."
            echo '{}' > data/config.json
          fi
      - name: Deploy via LFTP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: |
          sudo apt-get update --fix-missing || true
          sudo apt-get install -y lftp
          lftp -c "
          set ssl:verify-certificate no;
          set ftp:ssl-allow no;
          set ftp:passive-mode true;
          set net:timeout 10;
          set net:max-retries 3;
          set net:reconnect-interval-base 5;
          open -u $FTP_USERNAME,$FTP_PASSWORD 157.173.208.16;
          mirror -Rnv ./dist/ ./ --parallel=10 --no-perms --ignore-time --only-newer;
          mirror -Rnv ./dist-server/ ./ --parallel=10 --no-perms --ignore-time --only-newer;
          mirror -Rnv ./data/ ./ --parallel=10 --no-perms --ignore-time --only-newer;
          "