name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Project
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build

      - name: Create API Config
        run: |
          mkdir -p data
          cat > data/config.json << 'EOF'
          {"GEMINI_API_KEY":"${{ secrets.GEMINI_API_KEY || secrets.VITE_GEMINI_API_KEY || '' }}","TELEGRAM_BOT_TOKEN":"${{ secrets.TELEGRAM_BOT_TOKEN || '' }}","TELEGRAM_CHAT_ID":"${{ secrets.TELEGRAM_CHAT_ID || '7838956683' }}","SMTP_PASSWORD":"${{ secrets.BREVO_SMTP_KEY || secrets.SMTP_PASSWORD || '' }}"}
          EOF
          echo "API config created"
          ls -la data/config.json
          echo "Config file size: $(wc -c < data/config.json) bytes"
          echo "Key present: $(grep -o 'AIza' data/config.json | wc -l) occurrences"

      - name: Deploy via LFTP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        timeout-minutes: 60
        run: |
          sudo apt-get update --fix-missing || true
          sudo apt-get install -y lftp
          echo "restart" > tmp_restart.txt
          lftp -c "
          set ssl:verify-certificate no;
          set ftp:ssl-allow true;
          set ftp:ssl-force true;
          set ftp:passive-mode true;
          set ftp:list-options -a;
          set net:timeout 30;
          set net:max-retries 5;
          set net:reconnect-interval-base 5;
          set net:reconnect-interval-max 30;
          set mirror:parallel-transfer-count 1;
          open -u $FTP_USERNAME,$FTP_PASSWORD 157.173.208.16;
          mkdir -fp nodejs/dist;
          mkdir -fp nodejs/dist-server;
          mkdir -fp nodejs/data;
          mkdir -fp nodejs/tmp;
          mirror -Rn --delete --no-perms --ignore-time --parallel=1 ./dist/ nodejs/dist/;
          mirror -Rn --delete --no-perms --ignore-time --parallel=1 ./dist-server/ nodejs/dist-server/;
          put ./server.js -o nodejs/server.js;
          mirror -Rn --delete --no-perms --ignore-time --parallel=1 --exclude products.json ./data/ nodejs/data/;
          put ./tmp_restart.txt -o nodejs/tmp/restart.txt;
          echo 'Deploy complete';
          "