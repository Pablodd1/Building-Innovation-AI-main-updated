name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Project
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build

      - name: Create API Config
        run: |
          mkdir -p data
          cat > data/config.json << 'EOF'
          {"GEMINI_API_KEY":"${{ secrets.GEMINI_API_KEY || secrets.VITE_GEMINI_API_KEY || '' }}","TELEGRAM_BOT_TOKEN":"${{ secrets.TELEGRAM_BOT_TOKEN || '' }}","TELEGRAM_CHAT_ID":"${{ secrets.TELEGRAM_CHAT_ID || '7838956683' }}","SMTP_PASSWORD":"${{ secrets.BREVO_SMTP_KEY || secrets.SMTP_PASSWORD || '' }}"}
          EOF
          echo "API config created"
          ls -la data/config.json
          echo "Config file size: $(wc -c < data/config.json) bytes"
          echo "Key present: $(grep -o 'AIza' data/config.json | wc -l) occurrences"

      - name: Deploy via LFTP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: |
          sudo apt-get update --fix-missing || true
          sudo apt-get install -y lftp
          lftp -c "
          set ssl:verify-certificate no;
          set ftp:ssl-allow no;
          set ftp:passive-mode true;
          set net:timeout 15;
          set net:max-retries 5;
          set net:reconnect-interval-base 10;
          set net:reconnect-interval-max 60;
          open -u $FTP_USERNAME,$FTP_PASSWORD 157.173.208.16;
          mkdir -f nodejs/dist nodejs/dist-server nodejs/data;
          mirror -Rnv ./dist/ nodejs/dist/ --parallel=3 --no-perms --ignore-time;
          mirror -Rnv ./dist-server/ nodejs/dist-server/ --parallel=3 --no-perms --ignore-time;
          # Force overwrite config.json every deploy (no --only-newer)
          mirror -Rnv ./data/ nodejs/data/ --parallel=1 --no-perms --ignore-time;
          # Verify
          ls -la nodejs/data/config.json;
          ls -la nodejs/dist-server/app.cjs;
          "