name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Project
        run: npm run build

      - name: Create API Config
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p data
          echo '{"GEMINI_API_KEY":"'"$GEMINI_API_KEY"'"}' > data/config.json
          echo "API config created: $(cat data/config.json | cut -c1-50)..."

      - name: Deploy via LFTP
        env:
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        run: |
          sudo apt-get update --fix-missing || true
          sudo apt-get install -y lftp
          lftp -c "
          set ssl:verify-certificate no;
          set ftp:ssl-allow no;
          set ftp:passive-mode true;
          set net:timeout 10;
          set net:max-retries 3;
          set net:reconnect-interval-base 5;
          open -u $FTP_USERNAME,$FTP_PASSWORD 157.173.208.16;
          mirror -Rnv ./dist/ ./public_html/dist/ --parallel=10 --no-perms --ignore-time --only-newer;
          mirror -Rnv ./dist-server/ ./public_html/dist-server/ --parallel=10 --no-perms --ignore-time --only-newer;
          mirror -Rnv ./data/ ./public_html/data/ --parallel=10 --no-perms --ignore-time --only-newer;
          "